name: Site checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      # Static gate, worker/scoring/routing tests, research and seven-tool end-to-end suites, smoke, axe and keyboard tests.
      # Browser suites use mocked workers; nothing contacts the live services.
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-results/

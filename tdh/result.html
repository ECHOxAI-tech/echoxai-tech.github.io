<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://tdh-email.inbox-fde.workers.dev https://tdh-profile.inbox-fde.workers.dev https://tdh-research.inbox-fde.workers.dev https://tdh-mail.inbox-fde.workers.dev; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="referrer" content="no-referrer">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Retrieving result — The Dark Hierarchy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<meta name="description" content="Retrieve a saved result from The Dark Hierarchy interactive system."/>
<link rel="stylesheet" href="../assets/fonts/fonts.css"/>
  <link rel="stylesheet" href="../assets/a11y.css"/>
<style>
  :root { --black:#080806; --gold-dim:#a08336; --muted:#8f8a82; --rule:rgba(184,150,62,0.2); }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html { font-size:24px; background:var(--black); color:var(--muted); }
  body { font-family:'Inconsolata',monospace; font-weight:300; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:2rem; text-align:center; }
  .msg { font-size:0.55rem; letter-spacing:0.18em; text-transform:uppercase;
    color:var(--muted); margin-bottom:1.5rem; line-height:1.8; }
  .code-display { font-size:1rem; letter-spacing:0.3em; color:var(--gold-dim);
    border:1px solid var(--rule); padding:0.85rem 1.5rem; margin-bottom:1.5rem; }
  .err { font-size:0.5rem; letter-spacing:0.12em; color:var(--muted); line-height:1.7; }
  .err a { color:var(--gold-dim); text-decoration:none; }
  .err a:hover { text-decoration:underline; }
</style>
  <link rel="stylesheet" href="type.css"/>
  <link rel="stylesheet" href="a11y.css"/>
</head>
<body>
<p class="msg" id="msg">Looking up your result&hellip;</p>
<p class="code-display" id="code-el"></p>
<p class="err" id="err" style="display:none">
  No result found for this code.<br>
  Results are kept on the device that saved them, and are retrievable from other devices only if cross-device storage was chosen when the result was saved. Check the code and try again.<br><br>
  <a href="./index.html">&larr; Return to the tool suite</a>
</p>
<script>
const TOOLS = [
  { prefix:'tdh_t1_', path:'./tool-1-trigger-gradient.html' },
  { prefix:'tdh_t2_', path:'./tool-2-aspirational-self.html' },
  { prefix:'tdh_t3_', path:'./tool-3-attachment-confirmation.html' },
  { prefix:'tdh_t4_', path:'./tool-4-dark-night.html' },
  { prefix:'tdh_t5_', path:'./tool-5-protocol-designer.html' },
  { prefix:'tdh_t6_', path:'./tool-6-threshold.html' },
  { prefix:'tdh_t7_', path:'./tool-7-liturgy-matrix.html' },
];

(function(){
  const code = (new URLSearchParams(window.location.search)).get('code') || '';
  const norm = code.toUpperCase().trim();
  document.getElementById('code-el').textContent = norm || '——';

  if (!norm || norm.length !== 6 && norm.length !== 12) {
    document.getElementById('msg').textContent = 'No code provided.';
    document.getElementById('err').style.display = '';
    return;
  }

  try {
    for (const tool of TOOLS) {
      const raw = localStorage.getItem(tool.prefix + norm);
      if (raw) {
        document.getElementById('msg').textContent = 'Result found. Redirecting\u2026';
        window.location.replace(tool.path + '?code=' + norm);
        return;
      }
    }
  } catch(e) { /* storage blocked: fall through to the remote lookup */ }

  // Not on this device: look the code up in the profile service (possession of the code is the credential).
  // A found record is cached locally so the tool page can open it; a record that is not valid JSON is ignored.
  document.getElementById('msg').textContent = 'Looking for this code\u2026';
  const SERVICE = 'https://tdh-profile.inbox-fde.workers.dev/profile';
  Promise.all(TOOLS.map(function (tool, index) {
    return fetch(SERVICE + '?code=' + encodeURIComponent(norm) + '&tool=t' + (index + 1))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (body) { return body && body.found && body.data && typeof body.data === 'object' ? { tool: tool, data: body.data } : null; })
      .catch(function () { return null; });
  })).then(function (hits) {
    const hit = hits.find(Boolean);
    if (hit) {
      try { localStorage.setItem(hit.tool.prefix + norm, JSON.stringify(hit.data)); } catch (e) { /* the tool page will say storage is blocked */ }
      document.getElementById('msg').textContent = 'Result found. Redirecting\u2026';
      window.location.replace(hit.tool.path + '?code=' + norm);
      return;
    }
    document.getElementById('msg').textContent = 'Code not found.';
    document.getElementById('err').style.display = '';
  });
})();
</script>
<script src="../brand-mark.js?v=20261002t"></script>
<script src="a11y.js?v=20261002"></script>
<script src="../brand-signature.js?v=20261006"></script>
</body>
</html>
